name: Repository checks

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - run: npm install --global @mermaid-js/mermaid-cli@12.0.0
      - run: python scripts/release.py
      # Includes three-stack native/serial lifecycle, retries, corrupt diagrams,
      # immutable commit snapshots, partial modules and the 1500-file budget.
      - run: python -m pytest -q
      - run: python -m compileall -q src/toolkit src/test
      - run: git diff --check
