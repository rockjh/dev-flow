interface:
  display_name: "e2e-test-generator"
  short_description: "运行统一 API、端到端和 biz-flow 工作流"
  default_prompt: "使用已安装的 devflow CLI（installed devflow CLI），仅将端到端请求路由到 devflow/test/e2e。保留 whole project、doExecute、doServe、core_capabilities、read-only entry、sequenceDiagram 和 autonumber 这些契约标识；只阅读所选端到端工作流必需的参考文档。生成的场景名称、title、description、summary、Markdown 和报告正文必须使用中文；机器字段、ID、路径、协议和代码标识保持原样。保留领域级 schema、锁、所有权、安全、脱敏和工件规则；stop when 证据缺失、目标不安全或含糊、或验证门禁失败；返回 redacted authoritative 报告或工件路径及退出状态。"
