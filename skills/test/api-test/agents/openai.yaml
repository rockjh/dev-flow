interface:
  display_name: "bru-api-test-generator"
  short_description: "Run unified API, E2E, and biz-flow workflows"
  default_prompt: "Use the installed devflow CLI and route only api-test requests to devflow/test/api-test. Read only the references required for the selected api-test workflow. Preserve scoped schemas, locks, ownership, safety, redaction, and artifact rules; stop when evidence is missing, the target is unsafe or ambiguous, or a validation gate fails; return the redacted authoritative report or artifact path with its exit status."
