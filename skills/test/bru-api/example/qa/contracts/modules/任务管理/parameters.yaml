version: 1
module: tasks
swagger_tag: 任务管理
definitions:
  PageSize:
    name: pageSize
    in: query
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  Sort:
    name: sort
    in: query
    schema:
      type: string
      enum:
      - createdAt.asc
      - createdAt.desc
  Page:
    name: page
    in: query
    schema:
      type: integer
      minimum: 1
      default: 1
  IdempotencyKey:
    name: Idempotency-Key
    in: header
    required: true
    schema:
      type: string
      minLength: 8
      maxLength: 80
  TaskId:
    name: taskId
    in: path
    required: true
    schema:
      type: string
      format: uuid
  Status:
    name: status
    in: query
    schema:
      type: string
      enum:
      - queued
      - running
      - cancelling
      - completed
      - failed
  TenantId:
    name: X-Tenant-Id
    in: header
    required: true
    schema:
      type: string
      minLength: 1
parameters:
- endpoint_id: LISTTASKS_GET_TASKS
  items:
  - name: X-Tenant-Id
    in: header
    required: true
    $ref: '#/components/parameters/TenantId'
    schema:
      type: string
      minLength: 1
  - name: page
    in: query
    required: false
    $ref: '#/components/parameters/Page'
    schema:
      type: integer
      minimum: 1
      default: 1
  - name: pageSize
    in: query
    required: false
    $ref: '#/components/parameters/PageSize'
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  - name: status
    in: query
    required: false
    $ref: '#/components/parameters/Status'
    schema:
      type: string
      enum:
      - queued
      - running
      - cancelling
      - completed
      - failed
  - name: sort
    in: query
    required: false
    $ref: '#/components/parameters/Sort'
    schema:
      type: string
      enum:
      - createdAt.asc
      - createdAt.desc
- endpoint_id: CREATETASK_POST_TASKS
  items:
  - name: X-Tenant-Id
    in: header
    required: true
    $ref: '#/components/parameters/TenantId'
    schema:
      type: string
      minLength: 1
  - name: Idempotency-Key
    in: header
    required: true
    $ref: '#/components/parameters/IdempotencyKey'
    schema:
      type: string
      minLength: 8
      maxLength: 80
      example: '{{idempotency_key}}'
      x-local-environment: idempotency_key
- endpoint_id: GETTASK_GET_TASKS_TASKID
  items:
  - name: X-Tenant-Id
    in: header
    required: true
    $ref: '#/components/parameters/TenantId'
    schema:
      type: string
      minLength: 1
  - name: taskId
    in: path
    required: true
    $ref: '#/components/parameters/TaskId'
    schema:
      type: string
      format: uuid
      example: '{{task_id}}'
      x-local-environment: task_id
- endpoint_id: CANCELTASK_POST_TASKS_TASKID_CANCEL
  items:
  - name: X-Tenant-Id
    in: header
    required: true
    $ref: '#/components/parameters/TenantId'
    schema:
      type: string
      minLength: 1
  - name: taskId
    in: path
    required: true
    $ref: '#/components/parameters/TaskId'
    schema:
      type: string
      format: uuid
      example: '{{task_id}}'
      x-local-environment: task_id
