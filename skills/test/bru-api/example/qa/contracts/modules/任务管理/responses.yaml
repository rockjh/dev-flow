version: 1
module: tasks
swagger_tag: 任务管理
definitions: {}
responses:
- endpoint_id: LISTTASKS_GET_TASKS
  items:
    '200':
      description: Task page
      content:
        application/json:
          schema:
            type: object
            required:
            - items
            - page
            - pageSize
            - total
            properties:
              items:
                type: array
                items:
                  type: object
                  required:
                  - taskId
                  - taskType
                  - status
                  properties:
                    taskId:
                      type: string
                      format: uuid
                    taskType:
                      type: string
                    status:
                      type: string
                      enum:
                      - queued
                      - running
                      - cancelling
                      - completed
                      - failed
                  $ref: '#/components/schemas/Task'
              page:
                type: integer
              pageSize:
                type: integer
              total:
                type: integer
            $ref: '#/components/schemas/TaskPage'
    '400':
      description: Invalid query
    '401':
      description: Unauthenticated
    '403':
      description: Forbidden
- endpoint_id: CREATETASK_POST_TASKS
  items:
    '201':
      description: Task accepted
      content:
        application/json:
          schema:
            type: object
            required:
            - taskId
            - taskType
            - status
            properties:
              taskId:
                type: string
                format: uuid
              taskType:
                type: string
              status:
                type: string
                enum:
                - queued
                - running
                - cancelling
                - completed
                - failed
            $ref: '#/components/schemas/Task'
    '400':
      description: Invalid request
    '401':
      description: Unauthenticated
    '403':
      description: Forbidden
    '409':
      description: Idempotency conflict
    '415':
      description: Unsupported media type
- endpoint_id: GETTASK_GET_TASKS_TASKID
  items:
    '200':
      description: Task
      content:
        application/json:
          schema:
            type: object
            required:
            - taskId
            - taskType
            - status
            properties:
              taskId:
                type: string
                format: uuid
              taskType:
                type: string
              status:
                type: string
                enum:
                - queued
                - running
                - cancelling
                - completed
                - failed
            $ref: '#/components/schemas/Task'
    '401':
      description: Unauthenticated
    '403':
      description: Forbidden
    '404':
      description: Not found
- endpoint_id: CANCELTASK_POST_TASKS_TASKID_CANCEL
  items:
    '202':
      description: Cancellation requested
      content:
        application/json:
          schema:
            type: object
            required:
            - taskId
            - taskType
            - status
            properties:
              taskId:
                type: string
                format: uuid
              taskType:
                type: string
              status:
                type: string
                enum:
                - queued
                - running
                - cancelling
                - completed
                - failed
            $ref: '#/components/schemas/Task'
    '401':
      description: Unauthenticated
    '403':
      description: Forbidden
    '404':
      description: Not found
    '409':
      description: Not cancellable
