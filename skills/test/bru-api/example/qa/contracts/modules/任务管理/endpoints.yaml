              - export
            payload:
              type: object
              minProperties: 1
          $ref: '#/components/schemas/CreateTask'
  responses:
    '201':
      description: Task accepted
      content:
        application/json:
          schema:
            type: object
            required:
            - taskId
            - taskType
            - status
            properties:
              taskId:
                type: string
                format: uuid
              taskType:
                type: string
              status:
                type: string
                enum:
                - queued
                - running
                - cancelling
