interface:
  display_name: "biz-flow-doc-generator"
  short_description: "归纳业务入口，以冻结源码事实和原生代理解释生成流程图及覆盖报告"
  default_prompt: >-
    Use $biz-flow-doc-generator with the installed devflow CLI, routing only through
    devflow biz-flow with an explicit --project. Follow SKILL.md and its required
    references. First inventory the whole project with discover and check --stage
    entries, show the complete business overview and resolve source-checkable doubts.
    Honor existing classification authorization. Then prepare, execute the frozen
    tasks with current-session native agents under references/agent-orchestration.md,
    and collect evidence-bound analysis or typed evidence requests under
    references/behavior-evidence.md. Read only the task commit snapshot. Reanalyze
    replacement runs with new receipts; never copy facts, invent success or clear
    gaps by prose. Frozen flow determines the sequenceDiagram with autonumber and
    branch matrix. Keep business scope, the complete entry inventory and analysis
    status only in the overview; module files contain titles and entry flows. Preserve core contracts, locks, ownership, redaction and the sole
    version file docs/biz-flow/biz-flow-doc-generator-version.json. Run check, two
    consecutive successful verify calls and accept before advancing the baseline;
    restart both verify passes after a failure. Keep accepted runs accepted during
    later verification. Module-filtered acceptance never advances the project baseline.
    Reject snapshot directory aliases and stop baseline advancement on cleanup failure.
    Return Chinese business
    summaries and redacted authoritative report paths, source/coverage/phase status;
    stop when paths are unsafe, ownership is ambiguous, evidence is missing or
    validation fails. Report unsupported semantics and partial completion accurately.
    Use explicitly authorized serial analysis only under the Skill's fallback rules.
    Keep the fixed target commit, persistent module mapping and confirmation signature.
    Use source-proven resolutions under references/behavior-evidence.md; never waive unknown IO.
    Resume pending tasks with original receipts for reusable results; record batch_id.
    Reject unsupported run schema, host protocol, adapter or task-package domain;
    require a new prepare, never convert history or silently fall back to an older run.
    Report each gate's executed/passed status and partial module acceptance accurately.
    Read the behavior_report returned by prepare/resume and diagnose each entry from
    its exact frozen receiver, declaration signature, dependency version, configuration
    and controls. Zero gaps still require real analysis; use only implemented evidence
    semantics and reanalyze every required task in a replacement package. Unknown
    executor scheduling/rejection policy remains critical.
    Preserve receiver evaluation, local constructor delegation and instance initialization
    order. Stop normal continuation after a proven throw while retaining catch and
    cleanup. Unproven external constructors, class initialization and control merges
    remain critical under references/behavior-evidence.md. Registration coverage gaps
    block full delivery, and accepted modules never replace a full-scope run. Missing
    Mermaid rendering blocks document acceptance; adjust timeout only after an actual timeout.
    Before generating, modifying or verifying any sequence diagram, read references/diagram-conventions.md, the shared contract owned by the sequence-diagram-generator Skill. Apply it within this domain and stop when common or domain validation fails.


# Git source snapshot gate: target committed snapshot only; dirty and untracked source is excluded. Missing Git evidence stops analysis.
# Completion cleanup: remove process-only temporary artifacts; retain owned business assets, version lock and authoritative reports/recovery evidence.
