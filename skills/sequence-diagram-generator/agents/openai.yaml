interface:
  display_name: "Sequence Diagram Generator"
  short_description: "Evidence-linked sequence diagrams and requirement proposals"
  default_prompt: "Use $sequence-diagram-generator with the installed devflow CLI, routing only to devflow sequence-diagram-generator. Follow the root AGENTS.md and this Skill's routed references. Choose implementation, proposal or description intent explicitly; keep source symbols separate from input segment evidence. Bind explicit project, scope or segment IDs and real host receipts; preserve core schemas, redaction and asset ownership. Use docs/sequence-diagram/sequence-diagram-generator-version.json as the sole baseline; --out changes only generated business assets. Return redacted authoritative output and paths, explaining critical gaps, requirement status, local render status and local acceptance; stop when inputs are unsafe or ambiguous, evidence changes or verification fails. Keep Feishu online conversion outside this Skill and route it to the user-level Feishu CLI Skill."
