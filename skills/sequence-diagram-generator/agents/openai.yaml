interface:
  display_name: "Sequence Diagram Generator"
  short_description: "Evidence-linked sequence diagrams and requirement proposals"
  default_prompt: "Use $sequence-diagram-generator with the installed devflow CLI, routing only to devflow sequence-diagram-generator. Follow the root AGENTS.md and this Skill's routed references. Choose implementation, proposal or description intent explicitly; keep source symbols separate from input segment evidence. After prepare, use the current session's actual native child-agent tools to dispatch, wait and collect the frozen tasks with exclusive state handoff locations; do not probe brand CLIs or treat a prepared handoff as unavailability. Preserve real attempts, child IDs and session records, sourced observation times and unknown reclamation; native sequential execution needs no serial approval, and parallel claims require actual overlapping evidence. Serial fallback needs explicit scope authorization, never inferred from direct generation. Bind explicit project, scope or segment IDs and real host receipts; preserve core schemas, redaction and asset ownership. Use docs/sequence-diagram/sequence-diagram-generator-version.json as the sole baseline; --out changes only generated business assets. Return redacted authoritative output and paths with preparation, execution, collection and domain acceptance separately, plus the host-attested structure-only trust boundary; stop when inputs are unsafe or ambiguous, evidence changes, required tasks fail or verification fails. Keep Feishu online conversion outside this Skill and route it to the user-level Feishu CLI Skill. Before generating, modifying or verifying any sequence diagram, read references/diagram-conventions.md, the shared contract owned by the sequence-diagram-generator Skill. Apply it within this domain and stop when common or domain validation fails."

# Git source snapshot gate: use only the recorded committed snapshot; exclude modified and untracked files; use pre-change committed content for uncommitted edits; stop when Git evidence is missing or invalid.
# Completion cleanup: remove process-only temporary artifacts after success; retain owned assets, version lock, authoritative reports, and recovery evidence.
