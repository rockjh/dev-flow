      \  \nBusiness code: IDEMPOTENCY_CONFLICT  \nAssert: the error envelope identifies\
      \ the idempotency conflict\nRequest: {headers: {Idempotency-Key: reused}, body:\
      \ {taskType: reindex, payload: {scope: all}}}  \nAssert: $.code = IDEMPOTENCY_CONFLICT"
