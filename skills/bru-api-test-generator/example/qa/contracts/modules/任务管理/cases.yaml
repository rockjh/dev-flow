- id: CREATETASK_POST_TASKS_TASK_CREATE_ACCEPTED
  title: 创建任务成功
  description: 验证创建任务成功场景，预期结果按本用例现有契约核对。
  endpoint_id: CREATETASK_POST_TASKS
