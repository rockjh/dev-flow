    state: queued
    business_code: TASK_ACCEPTED
    business_code_path: $.code
  coverage_ids: []
  scenario: success
  source: design
  design_rule_ids:
  - TASK_CREATE_ACCEPTED
  design_evidence:
  - source_kind: design
    file: docs/biz-flow/任务管理.md
    symbol: TASK_CREATE_ACCEPTED
    line: 9
    endpoint_scope:
    - POST /tasks
    confidence: high
    quote: "Rule ID: TASK_CREATE_ACCEPTED  \nScenario: success  \nCondition: authenticated\
      \ tenant member sends a valid task and a new idempotency key  \nRequest: {body:\
      \ {taskType: export, payload: {format: csv}}}  \nHTTP status: 201  \nBusiness\
      \ code: TASK_ACCEPTED  \nState: queued  \nSide effect: one task record is created\
      \ for the caller tenant  \nAssert: $.status = queued"
