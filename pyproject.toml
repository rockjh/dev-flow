[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "8.0.0"
description = "Unified development lifecycle toolkit"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "pytest>=8"]

[project.scripts]
devflow = "devflow.cli:console_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
