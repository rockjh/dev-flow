[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "8.2.0"
description = "统一开发生命周期工具包"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6", "pytest>=8",
    "tree-sitter==0.25.2", "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0", "tree-sitter-rust==0.24.2",
]

[project.scripts]
devflow = "toolkit.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["toolkit*"]

[tool.setuptools.package-data]
"toolkit.core" = ["sequence-contracts.json"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]
