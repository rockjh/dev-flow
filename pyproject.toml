[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "8.1.0"
description = "统一开发生命周期工具包"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "pytest>=8"]

[project.scripts]
devflow = "toolkit.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["toolkit*"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]
